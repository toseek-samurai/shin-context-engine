name: Retry artifact publication (advanced)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing preview tag (for example v2.0.5-dev.100)
        required: true
        type: string
      run_id:
        description: Build, test and publish run ID (number from its URL)
        required: true
        type: string
      attempt:
        description: Exact qualified attempt (usually 1)
        required: true
        type: string
      platform:
        description: Platform with successful source and exact-package checks
        required: true
        type: choice
        options:
          - linux
          - macos
          - windows

permissions:
  contents: read

concurrency:
  group: preview-assets-refs/tags/${{ inputs.tag }}
  queue: max

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PREVIEW_TAG: ${{ inputs.tag }}
      QUALIFIED_RUN: ${{ inputs.run_id }}
      QUALIFIED_ATTEMPT: ${{ inputs.attempt }}
      PREVIEW_PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test guarded publisher
        run: python3 -B tools/test_publish_preview.py
      - name: Resolve qualified source
        id: source
        shell: bash
        run: |
          [[ "$QUALIFIED_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$QUALIFIED_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          qualified_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFIED_RUN" --jq .head_sha)
          [[ "$qualified_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$qualified_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: qualified-source
          persist-credentials: false
      - name: Publish exact previously qualified archive
        env:
          QUALIFIED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 -B tools/publish_preview.py --repo "$GITHUB_REPOSITORY" \
            --sha "$QUALIFIED_SHA" --tag "$PREVIEW_TAG" --platform "$PREVIEW_PLATFORM" \
            --run-id "$QUALIFIED_RUN" --attempt "$QUALIFIED_ATTEMPT" \
            --source-root "$GITHUB_WORKSPACE/qualified-source" --recover-publisher
