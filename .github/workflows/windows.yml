name: Windows source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Development source checks only. Hosted runners are elevated, unlike the
# supported user runtime. Full user-session, exact-package and installed SCM
# qualification are separate gates; this workflow does not publish packages.
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: native
            directory: .
            preset: windows-native
            tests: windows-native-smoke
          - component: desktop
            directory: observer
            preset: windows-desktop
            tests: windows-desktop-smoke
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare build paths
        id: paths
        run: |
          # Stay outside source/AppData/TEMP, with no '..' for upload-artifact.
          $buildRoot = [System.IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '../shin-windows-${{ matrix.component }}'))
          "SHIN_BUILD_ROOT=$buildRoot" >> $env:GITHUB_ENV
          "build_root=$buildRoot" >> $env:GITHUB_OUTPUT
      - name: Toolchain
        run: |
          cmake --version
          python --version
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Tests
        run: ctest --preset ${{ matrix.tests }} --output-junit "$env:SHIN_BUILD_ROOT/tests.xml"
      - name: Upload test reports
        if: always() && steps.paths.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-source-${{ matrix.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.paths.outputs.build_root }}/tests.xml
            ${{ steps.paths.outputs.build_root }}/**/Testing/Temporary/LastTest.log
            ${{ steps.paths.outputs.build_root }}/**/Testing/Temporary/LastTestsFailed.log
            ${{ steps.paths.outputs.build_root }}/**/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14
