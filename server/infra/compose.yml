name: shin-server-dev

services:
  postgres:
    image: postgres:18.6
    entrypoint: ["/usr/local/bin/shin-postgres-entrypoint"]
    command: ["postgres"]
    environment:
      POSTGRES_DB: shin_server_dev
      POSTGRES_USER: shin_migrator
      POSTGRES_PASSWORD_FILE: /run/shin-host-secrets/postgres_migrator_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      SHIN_RUNTIME_PASSWORD_FILE: /run/shin-host-secrets/shin_runtime_password
    ports:
      - "127.0.0.1:${SHIN_SERVER_DEV_POSTGRES_PORT:-15432}:5432"
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql
      - type: bind
        source: ${SHIN_SERVER_DEV_STATE_DIR:?SHIN_SERVER_DEV_STATE_DIR must name the private state directory}/secrets/postgres_migrator_password
        target: /run/shin-host-secrets/postgres_migrator_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SHIN_SERVER_DEV_STATE_DIR:?SHIN_SERVER_DEV_STATE_DIR must name the private state directory}/secrets/shin_runtime_password
        target: /run/shin-host-secrets/shin_runtime_password
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SHIN_SERVER_INFRA_DIR:?SHIN_SERVER_INFRA_DIR must name the reviewed server infrastructure directory}/postgres-entrypoint.sh
        target: /usr/local/bin/shin-postgres-entrypoint
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SHIN_SERVER_INFRA_DIR:?SHIN_SERVER_INFRA_DIR must name the reviewed server infrastructure directory}/init/10-runtime-role.sh
        target: /docker-entrypoint-initdb.d/10-runtime-role.sh
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shin_migrator -d shin_server_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    labels:
      com.shin.server.instance: development
      com.shin.server.database: shin_server_dev

volumes:
  postgres_data:
    name: shin-server-dev-postgres-data
